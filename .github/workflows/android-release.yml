name: Build & Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
        with:
          gradle-version: "8.7"

      - name: Assemble release APK (R8 + keep 规则)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: 列出产物
        run: |
          ls -lh app/build/outputs/apk/release/ || true

      - name: 对齐 + 签名
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK_IN="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          echo "输入 APK: $APK_IN"

          # 优先用仓库 Secrets 里的正式签名；没配就退化成一次性调试签名
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            KS_PASS="$KEYSTORE_PASSWORD"
            KS_ALIAS="$KEY_ALIAS"
            KS_KEYPASS="$KEY_PASSWORD"
          else
            echo "::warning::未配置签名 Secrets，使用临时调试签名（每次构建签名不同）"
            keytool -genkeypair -v -keystore release.jks \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            KS_PASS=android
            KS_ALIAS=androiddebugkey
            KS_KEYPASS=android
          fi

          OUT="XenoAnti-ban-${GITHUB_REF_NAME}.apk"
          "$BT/zipalign" -p -f 4 "$APK_IN" aligned.apk
          "$BT/apksigner" sign \
            --ks release.jks \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" \
            --key-pass "pass:$KS_KEYPASS" \
            --out "$OUT" aligned.apk
          "$BT/apksigner" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee SHA256SUMS.txt
          echo "OUT=$OUT" >> "$GITHUB_ENV"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.ref_name }}
          path: |
            ${{ env.OUT }}
            SHA256SUMS.txt
          retention-days: 30

      - name: 创建 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$OUT" SHA256SUMS.txt \
            --title "异客防封 $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            --verify-tag
